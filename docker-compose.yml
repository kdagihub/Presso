version: '3.9'

services:
  # =================================================================
  # PostgreSQL + PostGIS (Base de données géospatiale)
  # =================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: presso_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-presso_db}
      POSTGRES_USER: ${DB_USER:-presso_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-presso_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-presso_user} -d ${DB_NAME:-presso_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presso_network
    restart: unless-stopped

  # =================================================================
  # Redis (Cache + JWT Blacklist + Celery Broker)
  # =================================================================
  redis:
    image: redis:7-alpine
    container_name: presso_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presso_network
    restart: unless-stopped

  # =================================================================
  # Django Backend API
  # =================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: presso_backend
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        while ! nc -z postgres 5432; do sleep 1; done &&
        echo 'PostgreSQL started' &&
        echo 'Waiting for redis...' &&
        while ! nc -z redis 6379; do sleep 1; done &&
        echo 'Redis started' &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - presso_network
    restart: unless-stopped

  # =================================================================
  # Celery Worker (Tâches asynchrones : SMS, emails, etc.)
  # =================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: presso_celery_worker
    command: >
      sh -c "
        echo 'Waiting for redis...' &&
        while ! nc -z redis 6379; do sleep 1; done &&
        echo 'Redis started' &&
        echo 'Waiting for postgres...' &&
        while ! nc -z postgres 5432; do sleep 1; done &&
        echo 'PostgreSQL started' &&
        celery -A config worker -l info --concurrency=2
      "
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - presso_network
    restart: unless-stopped

  # =================================================================
  # Celery Beat (Tâches planifiées : nettoyage OTP, rapports, etc.)
  # =================================================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: presso_celery_beat
    command: >
      sh -c "
        echo 'Waiting for redis...' &&
        while ! nc -z redis 6379; do sleep 1; done &&
        echo 'Redis started' &&
        echo 'Waiting for postgres...' &&
        while ! nc -z postgres 5432; do sleep 1; done &&
        echo 'PostgreSQL started' &&
        celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
      "
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - presso_network
    restart: unless-stopped

# =================================================================
# Volumes persistants
# =================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local

# =================================================================
# Réseau interne
# =================================================================
networks:
  presso_network:
    driver: bridge

